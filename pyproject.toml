[project]
name = "purchase-intent-xai"
version = "0.1.0"
description = "Purchase-intent prediction with explainable AI, an API, and a dashboard."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
